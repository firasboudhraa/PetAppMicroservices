spring:
  application:
    name: PetMs
  servlet:
    multipart:
      location: ./uploads/
  web:
    resources:
      static-locations:
        file: ${user.dir}/PetMs/uploads/


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/petsMs?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
eureka:
  instance:
    hostname: ${EUREKA_SERVER_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_HOSTNAME:http://localhost}:8761/eureka

server:
  port: 8050

