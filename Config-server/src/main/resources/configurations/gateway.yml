eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/
    register-with-eureka: false

server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            allowCredentials: true
      routes:
        - id: services
          uri: http://localhost:8090
          predicates:
            - Path=/api/services/**
        - id: appointments
          uri: http://localhost:8091
          predicates:
            - Path=/api/appointments/**
        - id: notifications
          uri: http://localhost:8092
          predicates:
            - Path=/api/notifications/**
        - id: carnets
          uri: http://localhost:8070
          predicates:
            - Path=/api/carnet/**
        - id: records
          uri: http://localhost:8071
          predicates:
            - Path=/api/medicalrecord/**
        - id: posts
          uri: http://localhost:8082
          predicates:
            - Path=/posts/**
        - id: comments
          uri: http://localhost:8083
          predicates:
            - Path=/comments/**
        - id: PetMs-pet
          uri: http://localhost:8050
          predicates:
            - Path=/api/v1/pet/**
        - id: PetMs-adoptionRequest
          uri: http://localhost:8050
          predicates:
            - Path=/api/v1/adoptionRequest/**
        - id: PetMs-petSittingOffer
          uri: http://localhost:8050
          predicates:
            - Path=/api/v1/petSittingOffer/**
        - id: PetMs-chatbot
          uri: http://localhost:8050
          predicates:
            - Path=/api/chat/**
        - id: user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**

management:
  tracing:
    sampling:
      probability: 1.0

