eureka:
  instance:
    hostname: ${EUREKA_SERVER_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_HOSTNAME:http://localhost}:8761/eureka
    register-with-eureka: false

server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            allowCredentials: true
      routes:
        - id: services
          uri: lb://SERVICES
          predicates:
            - Path=/api/services/**
        - id: appointments
          uri: lb://APPOINTMENT
          predicates:
            - Path=/api/appointments/**
        - id: carnets
          uri: lb://MEDICALNOTEBOOK
          predicates:
            - Path=/api/carnet/**
        - id: records
          uri: lb://MEDICALRECORD
          predicates:
            - Path=/api/medicalrecord/**
        - id: posts
          uri: lb://POSTS
          predicates:
            - Path=/posts/**
        - id: comments
          uri: lb://COMMENTS
          predicates:
            - Path=/comments/**
        - id: PetMs-pet
          uri: lb://PETMS
          predicates:
            - Path=/api/v1/pet/**
        - id: PetMs-adoptionRequest
          uri: lb://PETMS
          predicates:
            - Path=/api/v1/adoptionRequest/**
        - id: PetMs-petSittingOffer
          uri: lb://PETMS
          predicates:
            - Path=/api/v1/petSittingOffer/**
        - id: user
          uri: lb://USER_SERVICE
          predicates:
            - Path=/api/user/**
        - id: auth
          uri: lb://USER_SERVICE
          predicates:
            - Path=/api/auth/**
        - id: admin
          uri: lb://USER_SERVICE
          predicates:
            - Path=/api/admin/**
        - id: donations
          uri: lb://DONATIONS
          predicates:
            - Path=/donation/**
        - id: events
          uri: lb://EVENTS
          predicates:
            - Path=/event/**
        - id: marketplaces
          uri: lb://MARKETPLACES
          predicates:
            - Path=/api/marketplaces/**
        - id: payments
          uri: lb://PAYMENTS
          predicates:
            - Path=/api/payment/**
        - id: baskets
          uri: lb://BASKETS
          predicates:
            - Path=/api/baskets/**
        - id: products
          uri: lb://PRODUCTS
          predicates:
            - Path=/api/products/**

