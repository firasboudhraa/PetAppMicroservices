eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/

server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: carnets
          uri: http://localhost:8070
          predicates:
            - Path=/api/carnets/**
        - id: records
          uri: http://localhost:8071
          predicates:
            - Path=/api/medicalrecord/**



management:
  tracing:
    sampling:
      probability: 1.0