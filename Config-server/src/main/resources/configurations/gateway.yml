eureka:
  client:
    register-with-eureka: false
server:
  port: 8222
spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
            allowCredentials: true
      routes:
        - id: services
          uri: http://localhost:8090
          predicates:
            - Path=/api/services/**
        - id: appointments
          uri: http://localhost:8091
          predicates:
            - Path=/api/appointments/**
        - id: notifications
          uri: http://localhost:8092
          predicates:
            - Path=/api/notifications/**

management:
  tracing:
    sampling:
      probability: 1.0