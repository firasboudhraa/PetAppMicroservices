eureka:
  client:
    register-with-eureka: false
server:
  port: 8222
spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            allowCredentials: true
      routes:
        - id: services
          uri: http://localhost:8090
          predicates:
            - Path=/api/services/**
        - id: appointments
          uri: http://localhost:8091
          predicates:
            - Path=/api/appointments/**

management:
  tracing:
    sampling:
      probability: 1.0