eureka:
  instance:
    hostname: ${EUREKA_SERVER_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOSTNAME:localhost}:${SERVER_PORT:8070}/eureka/

server:
  port: ${SERVER_PORT:8070}

spring:
  application:
    name: ${SPRING_APP_NAME:MedicalNotebook}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:carnets}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

application:
  config:
    record-url: ${RECORD_URL:http://localhost}:8071/api/medicalrecord
