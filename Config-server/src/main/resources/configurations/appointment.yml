eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/

server:
  port: 8091

spring:
  application:
    name: appointment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/appointments?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

rabbitmq:
  exchanges:
    petservice: petservice.exchange
  queues:
    petservice: petservice.queue
  routing-keys:
    petservice: petservice.routingkey

application:
  config:
    pets-url: http://localhost:8050/api/v1/pets

management:
  tracing:
    sampling:
      probability: 1.0