eureka:
  instance:
    hostname: ${EUREKA_SERVER_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_HOSTNAME:http://localhost}:8761/eureka

server:
  port: ${SERVER_PORT:8013}

spring:
  application:
    name: baskets
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baskets}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

application:
    config:
        product-url: ${PRODUCT_URL:http://localhost}:8011
